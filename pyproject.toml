[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-manager"
version = "3.3.6"
description = "Create SSH Tunnels to your remote hosts and host as an MCP Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "scion-sdk[mcp]>=0.5.9,<0.6.0", "fastmcp>=4.1.0", "paramiko>=5.0.0", "asyncssh>=2.24.1",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
tunnel-manager = "tunnel_manager.tunnel_manager:main"
tunnel-manager-mcp = "agent_connector_sdk.cli:serve"
tunnel-manager-doctor = "tunnel_manager.doctor:main"

[project.entry-points."agent_connector_sdk.prompt_providers"]
tunnel-manager = "tunnel_manager.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
tunnel-manager-mcp = "tunnel_manager:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
tunnel_manager = [ "mcp_config.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "tunnel_manager*",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pipelines.container]
debug_apt = ["default-jre", "ripgrep", "tree", "fd-find", "curl", "nano", "build-essential", "cmake", "libssl-dev", "libcurl4-openssl-dev", "pkg-config", "cargo", "rustc"]
