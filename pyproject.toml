[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-manager"
version = "3.1.0"
description = "Create SSH Tunnels to your remote hosts and host as an MCP Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
# NOTE (EH-484, see /var/tmp/l9/finish/au-decon-G4e/SDK-GAPS.md): agent-utilities is
# NOT fully dropped here. This connector still uses four AU modules with no
# agent_connector_sdk equivalent (none are in EH-485's toolkit-deletion list, so
# they are not part of this migration's scope): security.persistence_privacy
# (response redaction, pervasive), security.request_identity
# (apply_served_security_profile), security.entitlements
# (identity_scoped_resources), observability.health/health_ingest (already
# try/except-optional in net_health.py). Everything else (mcp.*, core.config,
# core.transport_security, base_utilities, security.brain_context/actor_identity,
# security.secrets_client, native_ingest) is migrated to agent-connector-sdk.
dependencies = [ "agent-connector-sdk>=0.1.0,<1.0.0", "agent-utilities>=2.0.0,<3.0.0", "fastmcp>=3.4.4", "paramiko>=5.0.0", "asyncssh>=2.24.0",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
tunnel-manager = "tunnel_manager.tunnel_manager:main"
tunnel-manager-mcp = "tunnel_manager.mcp_server:mcp_server"
tunnel-manager-health = "tunnel_manager.net_health:main_sample"
tunnel-manager-health-derive = "tunnel_manager.net_health:main_derive"
tunnel-manager-doctor = "tunnel_manager.doctor:main"

[project.entry-points."agent_utilities.skill_providers"]
tunnel-manager = "tunnel_manager.skills"

[project.entry-points."agent_utilities.ontology_providers"]
tunnel-manager = "tunnel_manager.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
tunnel-manager = "tunnel_manager.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
tunnel-manager = "tunnel_manager.prompts"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
tunnel_manager = [ "mcp_config.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "tunnel_manager*",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.0.0b1",
]

[tool.uv.sources]
agent-connector-sdk = { path = ".uv-workspace-siblings/agent-connector-sdk", editable = true }
agent-utilities = { path = ".uv-workspace-siblings/agent-utilities", editable = true }
