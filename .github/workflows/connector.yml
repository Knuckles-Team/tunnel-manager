name: Connector

# Copy to .github/workflows/connector.yml (reference/ci-standard.md, "Connector pipeline").
# The ONE caller a connector carries; every pipeline change is made in pipelines'
# connector_pipeline.yml. Routing by event:
#   pull_request        gates, affected tests, image check
#   push to main        org-site notify + main checks; never publishes
#   push of a v* tag    PyPI, then Docker, and GitHub Pages
#   schedule, repository_dispatch, workflow_dispatch   SDK rebuild
# Releases are cut by the owner with gh: scripts/release_connector.sh in pipelines (the owner's tag push publishes).
# Per-connector differences are `with:` inputs of the job below (all defaulted).
# The GitHub Pages environment needs a `v*` tag deployment policy.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 5 * * *'
  repository_dispatch:
    types: [sdk-release]
  workflow_dispatch:
    inputs:
      release_repair:
        description: Republish the already published container after the reviewed public-wheel guard.
        required: false
        default: false
        type: boolean
      release_source_sha:
        description: Full SHA of the original package source that produced the public wheel.
        required: false
        default: ''
        type: string
      release_source_epoch:
        description: Exact SOURCE_DATE_EPOCH used to generate the public connector payload.
        required: false
        default: ''
        type: string
      legacy_profile:
        description: Preserve the reviewed tracked wheel-only package tree without renderer generation.
        required: false
        default: false
        type: boolean

# Pull requests cancel superseded runs; every other event queues per event and ref and never cancels.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('connector-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pipeline:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: Knuckles-Team/pipelines/.github/workflows/connector_pipeline.yml@main
    with:
      release_repair: ${{ inputs.release_repair || false }}
      release_source_sha: ${{ inputs.release_source_sha || '' }}
      release_source_epoch: ${{ inputs.release_source_epoch || '' }}
      legacy_profile: ${{ inputs.legacy_profile || false }}
      pages-spec-dashboard-config: .config/spec-dashboard.json
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
      org_site_app_id: ${{ secrets.org_site_app_id }}
      org_site_app_private_key: ${{ secrets.org_site_app_private_key }}

  # Windows portability (CONN-TUNNEL-MANAGER-SDK-R006): the whole suite on Windows,
  # aggregated by `CI required` so the one required check covers it.
  windows:
    name: Windows tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync test environment
        run: uv sync --extra test
      - name: Unit tests
        run: uv run pytest tests -q --tb=short

  # The one required status check (reference/ci-standard.md): named in the caller so the
  # ruleset context is exactly `CI required`. Skipped routes pass; failed or cancelled fail.
  ci-required:
    name: CI required
    if: always()
    needs: [pipeline, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail on a failed or cancelled pipeline or Windows leg (skipped is fine)
        env:
          RESULT: ${{ needs.pipeline.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "pipeline result: $RESULT; windows result: $WINDOWS"
          for r in "$RESULT" "$WINDOWS"; do
            case "$r" in failure|cancelled) echo "::error::a required leg ended $r"; exit 1;; esac
          done
